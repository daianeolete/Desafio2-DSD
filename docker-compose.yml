
services:
  postgres:
    image: postgres:16
    container_name: dsd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsd_user
      POSTGRES_PASSWORD: dsd_senha
      POSTGRES_DB: pagamentos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dsd-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dsd_user
      RABBITMQ_DEFAULT_PASS: dsd_senha
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"

volumes:
  postgres_data:
